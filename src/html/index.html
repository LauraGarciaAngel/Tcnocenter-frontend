<!doctype html>
<html lang="es" data-bs-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tienda en línea de tcnocenter — E-commerce oficial." />
  <link rel="icon" type="image/png" href="../assets/images/Logo.png">
  <title>tcnocenter | Inicio</title>

  <!-- Google Fonts Preconnect & Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@300;400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Estilos de Bootstrap y Personalización de tcnocenter -->
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/catalogo.css" />

  <!-- Lucide Icons y Comportamiento JavaScript -->
  <script src="../js/lucide.min.js"></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/navbar-footer.js" defer></script>
  <script src="../js/catalogo.js" defer></script>
  <script src="../js/Carrusel-categorias.js" defer></script>
</head>

<body>
  <!-- Ejemplo de uso: cada marcador se reemplaza por src/components/{nombre}.html -->
  <div data-component="navbar"></div>

  <!-- PRODUCTOS MÁS VENDIDOS -->
  <section class="productos-destacados" aria-labelledby="productos-titulo">

    <div class="container">

      <div class="productos-header">

        <div>
          <h2 id="productos-titulo" class="productos-titulo">
            Más vendidos
          </h2>

          <p>
            Descubre los celulares más populares de nuestra tienda.
          </p>
        </div>

      </div>

      <div class="productos-carousel">

        <!-- Botón anterior -->
        <button class="carousel-btn" type="button" data-carousel-prev aria-label="Productos anteriores">

          &#10094;

        </button>

        <!-- Lista de productos -->
        <div class="lista-productos" data-best-sellers aria-live="polite">

          <!-- Los productos se generan con JavaScript -->

        </div>

        <!-- Botón siguiente -->
        <button class="carousel-btn" type="button" data-carousel-next aria-label="Productos siguientes">

          &#10095;

        </button>

      </div>

      <p data-carousel-empty hidden>
        No hay productos disponibles.
      </p>

    </div>

  </section>

  <!-- Categorias destacadas -->
  <section class="categorias-destacadas" aria-labelledby="categorias-titulo">
    <div class="container">
      <h2 id="categorias-titulo" class="categorias-titulo">Categorías Destacadas</h2>

      <div class="categorias-carousel">
        <button class="carousel-btn carousel-btn-prev" aria-label="Anterior">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <ul class="lista-categorias">
          <li>
            <a href="#" class="categoria-item">
              <img src="/src/assets/images/logo_apple.png" alt="Apple" class="logo-apple">
            </a>
          </li>
          <li>
            <a href="#" class="categoria-item">
              <img src="/src/assets/images/logo_xiaomi.png" alt="Xiaomi" class="logo-xiaomi">
            </a>
          </li>
          <li>
            <a href="#" class="categoria-item">
              <img src="/src/assets/images/logo_samsung.png" alt="Samsung" class="logo-samsung">
            </a>
          </li>
          <li>
            <a href="#" class="categoria-item">
              <img src="/src/assets/images/logo_huawei.png" alt="Huawei" class="logo-huawei">
            </a>
          </li>
          <li>
            <a href="#" class="categoria-item">
              <img src="/src/assets/images/logo_motorola.png" alt="Motorola" class="logo-motorola">
            </a>
          </li>
          <li>
            <a href="#" class="categoria-item">
              <img src="/src/assets/images/logo_tecno.png" alt="Tecno" class="logo-tecno">
            </a>
          </li>
          <li>
            <a href="#" class="categoria-item">
              <img src="/src/assets/images/logo_tecno.png" alt="Tecno" class="logo-tecno">
            </a>
          </li>
          <li>
            <a href="#" class="categoria-item">
              <img src="/src/assets/images/logo_tecno.png" alt="Tecno" class="logo-tecno">
            </a>
          </li>
          <li>
            <a href="#" class="categoria-item">
              <img src="/src/assets/images/logo_tecno.png" alt="Tecno" class="logo-tecno">
            </a>
          </li>
          <li>
            <a href="#" class="categoria-item">
              <img src="/src/assets/images/logo_tecno.png" alt="Tecno" class="logo-tecno">
            </a>
          </li>
          <li>
            <a href="#" class="categoria-item">
              <img src="/src/assets/images/logo_tecno.png" alt="Tecno" class="logo-tecno">
            </a>
          </li>
        </ul>
        <button class="carousel-btn carousel-btn-next" aria-label="Siguiente">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </section>

  <div data-component="footer"></div>
</body>

</html>
