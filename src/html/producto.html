<!doctype html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Detalle del producto en Tcnocenter." />
    <link rel="icon" type="image/png" href="../assets/images/tcnocenter/Logo.png" />
    <title>tcnocenter | Producto</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@300;400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="../css/main.css" />

    <script src="../js/lucide.min.js"></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/navbar-footer.js" defer></script>
    <script src="../js/cart.js" defer></script>
    <script src="../js/producto.js" defer></script>
</head>

<body class="tcno-product-page">
    <div data-component="navbar"></div>

    <main class="tcno-product-detail">
        <div class="tcno-product-status" data-product-status hidden>
            <p data-status-message>Cargando producto…</p>
            <a class="tcno-btn-outline" href="catalogo.html">Volver al catálogo</a>
        </div>

        <div class="tcno-product-shell" data-product-shell hidden>
            <nav class="tcno-breadcrumb" aria-label="Miga de pan">
                <a href="catalogo.html">Catálogo</a>
                <span aria-hidden="true">/</span>
                <a href="catalogo.html" data-breadcrumb-brand>Celulares</a>
                <span aria-hidden="true">/</span>
                <span data-breadcrumb-name>Producto</span>
            </nav>

            <div class="tcno-product-layout">
                <section class="tcno-product-gallery" aria-label="Imágenes del producto">
                    <div class="tcno-product-thumbs" data-thumbs>
                        <button type="button" class="tcno-thumb-nav tcno-thumb-nav--prev" data-thumb-prev
                            aria-label="Imagen anterior">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M18 15l-6-6-6 6" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                        <div class="tcno-thumbs-track" data-thumbs-track></div>
                        <button type="button" class="tcno-thumb-nav tcno-thumb-nav--next" data-thumb-next
                            aria-label="Imagen siguiente">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>

                    <div class="tcno-product-main-image" data-main-image-wrap>
                        <img data-main-image src="" alt="" />
                        <button type="button" class="tcno-image-zoom-btn" data-image-zoom
                            aria-label="Ampliar imagen del producto">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>
                </section>

                <section class="tcno-product-info-panel">
                    <p class="tcno-product-brand" data-product-brand hidden></p>
                    <h1 class="tcno-product-title" data-product-title>Product name</h1>
                    <p class="tcno-product-meta" data-product-meta hidden></p>

                    <div class="tcno-product-badges" data-product-badges hidden></div>

                    <div class="tcno-product-rating-row">
                        <div class="tcno-stars" data-stars aria-hidden="true"></div>
                        <span class="tcno-reviews" data-reviews>0 reseñas</span>
                    </div>

                    <div class="tcno-product-price-row">
                        <p class="tcno-product-price" data-product-price>$0</p>
                        <p class="tcno-product-old-price" data-product-old-price hidden></p>
                        <span class="tcno-product-discount" data-product-discount hidden></span>
                    </div>

                    <p class="tcno-product-desc" data-product-desc>Descripción del producto.</p>

                    <div class="tcno-product-colors" data-product-colors hidden>
                        <p class="tcno-product-colors-label">
                            Color: <span data-selected-color></span>
                        </p>
                        <div class="tcno-color-dots" data-color-dots role="list"></div>
                    </div>

                    <div class="tcno-product-actions">
                        <button type="button" class="tcno-btn-cart" data-add-cart>
                            Agregar al carrito
                        </button>
                        <button type="button" class="tcno-wishlist" data-wishlist aria-pressed="false"
                            aria-label="Agregar a favoritos">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                                    fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>


                    <div class="tcno-product-trust" aria-label="Beneficios de compra">
                        <div class="tcno-trust-item">
                            <span class="tcno-trust-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24">
                                    <path d="M1 3h15v13H1zM16 8h4l3 3v5h-7V8z" fill="none" stroke="currentColor"
                                        stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                                    <circle cx="5.5" cy="18.5" r="2.5" fill="none" stroke="currentColor"
                                        stroke-width="1.7" />
                                    <circle cx="18.5" cy="18.5" r="2.5" fill="none" stroke="currentColor"
                                        stroke-width="1.7" />
                                </svg>
                            </span>
                            <div>
                                <strong>Envío gratis</strong>
                                <span>Desde $300.000</span>
                            </div>
                        </div>
                        <div class="tcno-trust-item">
                            <span class="tcno-trust-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24">
                                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="none"
                                        stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                    <path d="m9 12 2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.7"
                                        stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </span>
                            <div>
                                <strong>Pago seguro</strong>
                                <span>Tus datos protegidos</span>
                            </div>
                        </div>
                        <div class="tcno-trust-item">
                            <span class="tcno-trust-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24">
                                    <path d="M12 15l-3-3 1.4-1.4L12 12.2l5.6-5.6L19 8l-7 7z" fill="none"
                                        stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                    <path d="M12 2 4 5v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V5l-8-3z"
                                        fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                </svg>
                            </span>
                            <div>
                                <strong>Garantía oficial</strong>
                                <span>12 meses del fabricante</span>
                            </div>
                        </div>
                    </div>

                    <p class="tcno-cart-feedback" data-cart-feedback role="status" aria-live="polite"></p>
                </section>
            </div>

            <section class="tcno-product-bottom" aria-label="Información adicional del producto">
                <div class="tcno-product-tabs" role="tablist" aria-label="Información del producto">
                    <button type="button" class="tcno-tab is-active" role="tab" aria-selected="true"
                        data-tab="details">Detalles</button>
                    <button type="button" class="tcno-tab" role="tab" aria-selected="false"
                        data-tab="packaging">Empaque</button>
                    <button type="button" class="tcno-tab" role="tab" aria-selected="false"
                        data-tab="shipping">Envío</button>
                    <button type="button" class="tcno-tab" role="tab" aria-selected="false"
                        data-tab="specs">Especificaciones técnicas</button>
                </div>

                <div class="tcno-tab-panels">
                    <div class="tcno-tab-panel is-active" data-panel="details" role="tabpanel">
                        <p data-tab-details></p>
                    </div>
                    <div class="tcno-tab-panel" data-panel="packaging" role="tabpanel" hidden>
                        <p data-tab-packaging></p>
                    </div>
                    <div class="tcno-tab-panel" data-panel="shipping" role="tabpanel" hidden>
                        <p data-tab-shipping></p>
                    </div>
                    <div class="tcno-tab-panel" data-panel="specs" role="tabpanel" hidden>
                        <dl class="tcno-specs-list" data-specs-list></dl>
                    </div>
                </div>
                </section>
        </div>
    </main>

    <div class="tcno-image-lightbox" data-image-lightbox hidden>
        <div class="tcno-image-lightbox__backdrop" data-lightbox-close></div>
        <div class="tcno-image-lightbox__dialog" role="dialog" aria-modal="true"
            aria-label="Imagen ampliada del producto">
            <button type="button" class="tcno-image-lightbox__close" data-lightbox-close
                aria-label="Cerrar imagen ampliada">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                </svg>
            </button>
            <img data-lightbox-image src="" alt="" />
        </div>
    </div>

    <div data-component="footer"></div>
</body>

</html>
