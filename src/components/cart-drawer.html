<aside class="tcno-cart-drawer" data-cart-drawer aria-labelledby="tcno-cart-title" aria-hidden="true">
  <div class="tcno-cart-drawer-header">
    <div>
      <p class="tcno-cart-eyebrow">Tu selección</p>
      <h2 id="tcno-cart-title">Carrito de compras</h2>
    </div>
    <button class="tcno-cart-close" type="button" data-cart-close aria-label="Cerrar carrito">&times;</button>
  </div>

  <div class="tcno-cart-items" data-cart-items></div>
  <p class="tcno-cart-empty" data-cart-empty>Tu carrito está vacío.</p>

  <div class="tcno-cart-summary">
    <div class="tcno-cart-total-row">
      <span>Subtotal</span>
      <strong data-cart-total>$0 COP</strong>
    </div>
    <button class="tcno-cart-checkout" type="button" data-cart-checkout disabled>Continuar compra</button>
  </div>
</aside>
<div class="tcno-cart-backdrop" data-cart-close aria-hidden="true"></div>
